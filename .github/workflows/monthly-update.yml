# Refresh the published CSVs from the public API, once a month.
#
# NOT ACTIVE YET in any useful sense. The export script exits cleanly and writes
# nothing while https://luvs.one/api/v1/price-index is unpublished, so this
# workflow will run and no-op every month until the API goes live. Nothing needs
# to be enabled at that point: the first run after launch writes the data.
#
# The 2nd of the month, not the 1st: a release for the closed month is frozen on
# the 1st, so running a day later leaves room for that to have happened.
name: Monthly data update

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      force_mirrors:
        description: 'Push to Kaggle and Hugging Face even if nothing changed (for testing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: the Codeberg push at the end
      # needs the ancestry to prove it is a fast forward, and a one commit clone
      # cannot. The repository is small, so the extra fetch costs nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependencies on purpose: the export uses only the standard library,
      # so this job cannot break on a package it does not control.
      - name: Export from the public API
        run: python3 scripts/export_from_api.py

      # Regenerates docs/index.html from the CSV that was just written, so the
      # published landing page can never describe a release the data does not
      # contain. The generator is deterministic (it reads only repository files,
      # never the clock), so a month with no new data leaves the file untouched
      # and the change check below still reports "no change" correctly.
      - name: Rebuild the landing page
        run: python3 scripts/build_site.py

      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change. The API is either unpublished or has no new release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "luvsone-bot"
          git config user.email "data@luvs.one"
          git add data docs index.md
          git commit -m "data: monthly refresh from the public API"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # One GitHub Release per data month, created automatically so the Zenodo
      # webhook mints the matching version DOI with zero manual steps. The tag is
      # derived from the newest month in the series (v2026.08 for 2026-08).
      # Idempotent: if the tag's release already exists, nothing happens, so a
      # manual re-run never duplicates a version. Releases created with the
      # workflow's own GITHUB_TOKEN do not trigger other workflows, but they DO
      # fire ordinary repository webhooks, which is what Zenodo listens on.
      - name: Publish release for Zenodo versioning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(tail -1 data/price-index.csv | cut -d, -f1)
          case "$month" in
            20[0-9][0-9]-[0-1][0-9]) ;;
            *) echo "No parsable month in the series ($month); skipping release."; exit 0 ;;
          esac
          tag="v${month/-/.}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          label=$(date -d "${month}-01" +"%B %Y" 2>/dev/null || echo "$month")
          notes=$(printf '%s\n\n%s\n%s\n\n%s' \
            "Monthly release of the Luvs Creator Price Index, with data through ${month}." \
            "Live figures and the release archive: https://luvs.one/stats" \
            "Dataset documentation and read only API: https://luvs.one/research" \
            "Aggregates only, CC BY 4.0.")
          gh release create "$tag" --title "${label} release" --notes "$notes"

      # ── Mirrors. Both steps SKIP CLEANLY when their secrets are absent, so the
      # workflow stays green before the tokens are configured and after any token
      # is revoked. They push only when this run committed fresh data (or when
      # force_mirrors is checked on a manual run, which exists to test the
      # tokens without waiting a month).
      - name: Mirror to Kaggle
        if: steps.commit.outputs.changed == 'true' || inputs.force_mirrors
        env:
          # Kaggle's NEW token format (KGAT_...), read by the CLI from this env
          # var; the legacy KAGGLE_USERNAME/KAGGLE_KEY pair is not needed with it.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN not configured; skipping mirror."
            exit 0
          fi
          pip -q install -U kaggle
          stage=$(mktemp -d)
          cp data/price-index.csv CODEBOOK.md "$stage"/
          cp data/releases/*.csv "$stage"/
          printf '{"id": "luvsone/creator-subscription-pricing-luvs-index"}\n' > "$stage/dataset-metadata.json"
          month=$(tail -1 data/price-index.csv | cut -d, -f1)
          kaggle datasets version -p "$stage" -m "Monthly refresh: data through ${month}" --quiet
          echo "Kaggle mirror updated through ${month}."

      - name: Mirror to Hugging Face
        if: steps.commit.outputs.changed == 'true' || inputs.force_mirrors
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN not configured; skipping mirror."
            exit 0
          fi
          pip -q install -U huggingface_hub
          month=$(tail -1 data/price-index.csv | cut -d, -f1)
          hf upload luvsone/creator_price_index data/price-index.csv price-index.csv \
            --repo-type dataset --commit-message "Monthly refresh: data through ${month}"
          echo "Hugging Face mirror updated through ${month}."

      # Codeberg carries a public copy of the repository. Codeberg has pull
      # mirrors disabled platform wide (they consume resources indefinitely), so
      # the copy is kept current by pushing to it rather than by it pulling from
      # here. A plain push, never forced: if the two ever diverge the step fails
      # loudly instead of quietly overwriting the copy of record.
      - name: Mirror to Codeberg
        if: steps.commit.outputs.changed == 'true' || inputs.force_mirrors
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: wizedesign/creator-price-index
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "CODEBERG_TOKEN not configured; skipping mirror."
            exit 0
          fi
          user="${CODEBERG_REPO%%/*}"
          git push "https://${user}:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO}.git" HEAD:main
          echo "Codeberg mirror updated."
