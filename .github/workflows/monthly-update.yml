# Refresh the published CSVs from the public API, once a month.
#
# NOT ACTIVE YET in any useful sense. The export script exits cleanly and writes
# nothing while https://luvs.one/api/v1/price-index is unpublished, so this
# workflow will run and no-op every month until the API goes live. Nothing needs
# to be enabled at that point: the first run after launch writes the data.
#
# The 2nd of the month, not the 1st: a release for the closed month is frozen on
# the 1st, so running a day later leaves room for that to have happened.
name: Monthly data update

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependencies on purpose: the export uses only the standard library,
      # so this job cannot break on a package it does not control.
      - name: Export from the public API
        run: python3 scripts/export_from_api.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No change. The API is either unpublished or has no new release."
            exit 0
          fi
          git config user.name  "luvsone-bot"
          git config user.email "data@luvs.one"
          git add data
          git commit -m "data: monthly refresh from the public API"
          git push

      # One GitHub Release per data month, created automatically so the Zenodo
      # webhook mints the matching version DOI with zero manual steps. The tag is
      # derived from the newest month in the series (v2026.08 for 2026-08).
      # Idempotent: if the tag's release already exists, nothing happens, so a
      # manual re-run never duplicates a version. Releases created with the
      # workflow's own GITHUB_TOKEN do not trigger other workflows, but they DO
      # fire ordinary repository webhooks, which is what Zenodo listens on.
      - name: Publish release for Zenodo versioning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          month=$(tail -1 data/price-index.csv | cut -d, -f1)
          case "$month" in
            20[0-9][0-9]-[0-1][0-9]) ;;
            *) echo "No parsable month in the series ($month); skipping release."; exit 0 ;;
          esac
          tag="v${month/-/.}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          label=$(date -d "${month}-01" +"%B %Y" 2>/dev/null || echo "$month")
          notes=$(printf '%s\n\n%s\n%s\n\n%s' \
            "Monthly release of the Luvs Creator Price Index, with data through ${month}." \
            "Live figures and the release archive: https://luvs.one/stats" \
            "Dataset documentation and read only API: https://luvs.one/research" \
            "Aggregates only, CC BY 4.0.")
          gh release create "$tag" --title "${label} release" --notes "$notes"
